# Run the whole app like production: `docker compose up --build`, then open
# http://localhost:8000 (Story 6.1, AD-15).
services:
  app:
    build: .
    image: bite-and-board:local
    ports:
      - '8000:8000'
    # Your local settings and keys (JWT_SECRET, ANTHROPIC_API_KEY, ...) come from the
    # same gitignored file as in development. They reach the container at run time
    # only; they are never copied into the image. Template: apps/recipe-service/.env.example
    env_file:
      - path: apps/recipe-service/.env
        required: true
    # These win over the .env file: the container always runs in production mode,
    # with its data on the volume and the built app served by FastAPI.
    environment:
      ENV: production
      COOKIE_SECURE: 'true'
      DATA_DIR: /data
      WEB_DIR: /app/web
    volumes:
      # SQLite database and photos. Survives `docker compose down` and rebuilds;
      # only `docker compose down -v` deletes it.
      - app-data:/data
    restart: unless-stopped
    # No reverse proxy here. If one is ever put in front of the app, its read timeout
    # must be at least 120 s so a slow AI import is never cut off (AD-43).

volumes:
  app-data:

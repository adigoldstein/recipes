[tool.coverage.run]
branch = true
source = [ "app" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/recipe-service/html'
 --cov-report xml:'../../coverage/apps/recipe-service/coverage.xml'
 --html='../../reports/apps/recipe-service/unittests/html/index.html'
 --junitxml='../../reports/apps/recipe-service/unittests/junit.xml'
"""

[project]
name = "recipe-service"
version = "1.0.0"
description = "Bite & Board core FastAPI backend"
requires-python = ">=3.13,<3.14"
readme = 'README.md'
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.13",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
  "mypy==2.4.0",
  "import-linter==2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Feature-module rules: layers point down, and modules meet only through services.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Feature layers point down: router -> service -> repository -> models"
type = "layers"
containers = [
  "app.auth",
  "app.imports",
  "app.photos",
  "app.recipes",
  "app.tags",
  "app.users",
]
layers = ["router", "service", "repository", "models"]
exhaustive = false

[[tool.importlinter.contracts]]
name = "auth: router, repository, models and schemas are private to the module"
type = "protected"
protected_modules = [
  "app.auth.router",
  "app.auth.repository",
  "app.auth.models",
  "app.auth.schemas",
]
allowed_importers = ["app.auth"]
ignore_imports = [
  "app.main -> app.auth.router",
  "app.core.metadata -> app.auth.models",
]

[[tool.importlinter.contracts]]
name = "imports: router, repository, models and schemas are private to the module"
type = "protected"
protected_modules = [
  "app.imports.router",
  "app.imports.repository",
  "app.imports.models",
  "app.imports.schemas",
]
allowed_importers = ["app.imports"]
ignore_imports = [
  "app.main -> app.imports.router",
  "app.core.metadata -> app.imports.models",
]

[[tool.importlinter.contracts]]
name = "photos: router, repository and models are private to the module"
type = "protected"
protected_modules = [
  "app.photos.router",
  "app.photos.repository",
  "app.photos.models",
]
allowed_importers = ["app.photos"]
ignore_imports = [
  "app.main -> app.photos.router",
  "app.core.metadata -> app.photos.models",
]

[[tool.importlinter.contracts]]
name = "recipes: router, repository, models and schemas are private to the module"
type = "protected"
protected_modules = [
  "app.recipes.router",
  "app.recipes.repository",
  "app.recipes.models",
  "app.recipes.schemas",
]
allowed_importers = ["app.recipes", "app.seed"]
ignore_imports = [
  "app.main -> app.recipes.router",
  "app.core.metadata -> app.recipes.models",
]

# tags.schemas (TagRef) and photos.schemas (PhotoRead) are public: recipes embeds
# them in its read schemas. Everything else stays behind the service.
[[tool.importlinter.contracts]]
name = "tags: router, repository and models are private to the module"
type = "protected"
protected_modules = [
  "app.tags.router",
  "app.tags.repository",
  "app.tags.models",
]
allowed_importers = ["app.tags"]
ignore_imports = [
  "app.main -> app.tags.router",
  "app.core.metadata -> app.tags.models",
]

[[tool.importlinter.contracts]]
name = "users: router, repository, models and schemas are private to the module"
type = "protected"
protected_modules = [
  "app.users.router",
  "app.users.repository",
  "app.users.models",
  "app.users.schemas",
]
# app.auth signs users in through users.service and UserRead only; the contract can't
# narrow it to those names, so the repository and models stay out of reach by review.
allowed_importers = ["app.users", "app.cli", "app.auth"]
ignore_imports = [
  "app.main -> app.users.router",
  "app.core.metadata -> app.users.models",
]

# Layers contracts allow skipping downwards; routers must still go through their service.
[[tool.importlinter.contracts]]
name = "Routers never reach the repository or models"
type = "forbidden"
source_modules = ["app.*.router"]
forbidden_modules = ["app.*.repository", "app.*.models"]
# Direct imports only: router -> service -> repository is the intended chain.
allow_indirect_imports = true

# The only cross-module edges among these four: recipes -> tags, photos; imports -> tags.
[[tool.importlinter.contracts]]
name = "tags depends on no other catalogue module"
type = "forbidden"
source_modules = ["app.tags"]
forbidden_modules = ["app.recipes", "app.imports", "app.photos"]

[[tool.importlinter.contracts]]
name = "photos depends on no other catalogue module"
type = "forbidden"
source_modules = ["app.photos"]
forbidden_modules = ["app.recipes", "app.imports", "app.tags"]

[[tool.importlinter.contracts]]
name = "recipes does not depend on imports"
type = "forbidden"
source_modules = ["app.recipes"]
forbidden_modules = ["app.imports"]

[[tool.importlinter.contracts]]
name = "imports depends only on tags"
type = "forbidden"
source_modules = ["app.imports"]
forbidden_modules = ["app.recipes", "app.photos"]

[[tool.importlinter.contracts]]
name = "core depends on no feature module (metadata only collects models)"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = [
  "app.auth",
  "app.imports",
  "app.photos",
  "app.recipes",
  "app.tags",
  "app.users",
]
ignore_imports = ["app.core.metadata -> app.*.models"]

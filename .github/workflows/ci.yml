name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

# A newer push to a PR supersedes its running check; main runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      # Installs the Python from apps/recipe-service/.python-version on first `uv sync`.
      # setup-uv publishes no moving major tags from v8 on, so pin the release.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: apps/recipe-service/uv.lock

      # Same npm as local development (`packageManager`), not the runner's bundled one.
      - run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - run: npm ci

      # --locked fails the run if uv.lock no longer matches pyproject.toml.
      - run: uv sync --locked
        working-directory: apps/recipe-service

      # Base = last green CI run on main, so `affected` checks everything since then.
      - uses: nrwl/nx-set-shas@v5

      - run: npx nx format:check
      - run: npx nx affected -t lint typecheck test build build-storybook
